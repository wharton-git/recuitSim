services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: recuitsim-backend
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    container_name: recuitsim-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"

